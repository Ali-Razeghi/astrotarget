[project]
name = "astrotarget"
version = "0.3.5"
description = "Exoplanet target intelligence: NASA Exoplanet Archive + Gaia DR3 + TESS, with provenance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13",
  "numpy>=1.26", "astropy>=6.0", "lightkurve>=2.5",
  "matplotlib>=3.8", "reportlab>=4.0",
  "arq>=0.26",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
markers = ["network: hits real archives/redis/postgres (deselected in CI)"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["RUF012"]
